<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/jpeg" href="/feranmi.jpeg" />
    <link rel="apple-touch-icon" href="/feranmi.jpeg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/feranmi-banner.webp" fetchpriority="high" />
    <!-- Above the fold too, but the app only asks for it once React has run. -->
    <link rel="preload" as="image" href="/feranmi.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f1" />
    <script src="/theme-init.js"></script>

    <title>Feranmi Oyetunde | Full Stack Software Engineer</title>
    <meta
      name="description"
      content="Feranmi Oyetunde is a full stack software engineer in Lagos, Nigeria, building with React, Next.js, TypeScript, Node.js, FastAPI and PostgreSQL."
    />
    <link rel="canonical" href="https://feranmioyetunde.com.ng/" />
    <meta name="author" content="Feranmi Oyetunde" />

    <!-- Open Graph: how the link renders on LinkedIn, WhatsApp, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Feranmi Oyetunde" />
    <meta property="og:url" content="https://feranmioyetunde.com.ng/" />
    <meta property="og:title" content="Feranmi Oyetunde | Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="I work across the whole request, browser to database. Most of what I build moves money or decides who sees what, so I put the rules first."
    />
    <meta property="og:image" content="https://feranmioyetunde.com.ng/og-image.jpg" />
    <meta property="og:image:alt" content="Feranmi Oyetunde, Software Developer" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Feranmi Oyetunde | Full Stack Software Engineer" />
    <meta
      name="twitter:description"
      content="I work across the whole request, browser to database. Most of what I build moves money or decides who sees what, so I put the rules first."
    />
    <meta name="twitter:image" content="https://feranmioyetunde.com.ng/og-image.jpg" />
  </head>
  <body>
    <!-- The page is prerendered, so it reads fine without JavaScript, but the
         scroll fade-ins start hidden and need it to appear. Show them as-is. -->
    <noscript>
      <style>#root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
